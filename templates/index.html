<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Personal Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1 class="main-heading">AI Personal Assistant</h1>

    <div class="container">

        <section class="card">
            <h2>🤖 Ask Anything</h2>

            <form id="askForm">

                <div class="input-group">
                    <input
                        type="text"
                        name="question"
                        placeholder="Ask anything..."
                        required
                    >

                    <button type="submit">
                        Ask
                    </button>
                </div>

            </form>

            <p id="ans-loading" class="loading">
                Thinking...
            </p>

            <div id="answer" class="response"></div>
        </section>


        <section class="card">

            <h2>📧 Summarize Email</h2>

            <form id="emailForm">

                <textarea
                    name="email"
                    placeholder="Paste your email here..."
                    required
                ></textarea>

                <button type="submit">
                    Summarize
                </button>

            </form>

            <p id="summary-loading" class="loading">
                Summarizing...
            </p>

            <div id="summary" class="response"></div>

        </section>

    </div>


<script>

    // ASK AI

    document.getElementById("askForm").onsubmit = async (e) => {

        e.preventDefault();

        let formData = new FormData(e.target);

        let loading = document.getElementById("ans-loading");

        let answer = document.getElementById("answer");

        loading.style.display = "block";

        answer.innerText = "";

        try {

            let res = await fetch("/ask", {
                method: "POST",
                body: formData
            });

            let data = await res.json();

            answer.innerText = data.response;

        } catch (error) {

            answer.innerText =
                "Something went wrong. Please try again.";

        }

        loading.style.display = "none";
    };


    // EMAIL SUMMARIZER

    document.getElementById("emailForm").onsubmit = async (e) => {

        e.preventDefault();

        let formData = new FormData(e.target);

        let loading =
            document.getElementById("summary-loading");

        let summary =
            document.getElementById("summary");

        loading.style.display = "block";

        summary.innerText = "";

        try {

            let res = await fetch("/summarize", {
                method: "POST",
                body: formData
            });

            let data = await res.json();

            summary.innerText = data.response;

        } catch (error) {

            summary.innerText =
                "Something went wrong. Please try again.";

        }

        loading.style.display = "none";
    };

</script>

</body>
</html>c
